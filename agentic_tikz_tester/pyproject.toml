[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-tikz-tester"
version = "0.1.0"
description = "Agentic visual regression / bug-finding framework for tikzplotlib / MakinTikZ"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.25",
    "click>=8.0",
    "matplotlib>=3.5",
    "numpy>=1.21",
    "pillow>=9.0",
    "scikit-image>=0.19",
    "pdf2image>=1.16",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]

[project.scripts]
agentic-tikz-tester = "agentic_tikz_tester.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."console_scripts"]
agentic-tikz-tester = "agentic_tikz_tester.cli:main"
